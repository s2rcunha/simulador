<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Esquema 2D · montagem da superestrutura</title>
<style>
  :root{--bg:#eef1f5;--panel:#ffffff;--bd:#d5dbe3;--txt:#1d2733;--mut:#6b7785;--acc:#c62828;--sel:#1e88e5;--ok:#2e7d32}
  *{box-sizing:border-box} html,body{margin:0;height:100%;font:13px/1.35 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--txt);background:var(--bg)}
  #app{display:grid;grid-template-columns:270px 1fr;grid-template-rows:auto 1fr;height:100vh}
  header{grid-column:1/3;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;background:#1d2733;color:#fff}
  header h1{font-size:15px;margin:0 10px 0 0;letter-spacing:.02em} header .esp{flex:1}
  header button,header select,header label{font:inherit;color:#fff;background:#2e3a48;border:1px solid #445366;border-radius:8px;padding:5px 9px;cursor:pointer}
  header button:hover{background:#3a4859} header a{color:#fff}
  header label{display:flex;align-items:center;gap:5px}
  #play{background:#2e7d32;border-color:#2e7d32;font-weight:700} #play.on{background:var(--acc);border-color:var(--acc)}
  aside{background:var(--panel);border-right:1px solid var(--bd);overflow:auto;padding:10px}
  aside input[type=search]{width:100%;padding:7px 9px;border:1px solid var(--bd);border-radius:8px;font:inherit;margin-bottom:8px}
  details{margin:0 0 6px} summary{font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);cursor:pointer;padding:4px 2px}
  .pal{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:4px 0 8px}
  .it{border:1px solid var(--bd);border-radius:10px;padding:6px 4px 5px;text-align:center;cursor:grab;user-select:none;background:#fafbfc;touch-action:none}
  .it:hover{border-color:var(--sel);background:#f0f7ff} .it img{height:46px;max-width:100%;pointer-events:none;display:block;margin:0 auto 3px} .it span{font-size:11px;display:block}
  body.tocando aside{opacity:.45;pointer-events:none}
  main{position:relative;overflow:hidden}
  #palco{width:100%;height:100%;display:block;background:#f8fafc;touch-action:none;cursor:default}
  #props{position:absolute;right:12px;top:12px;width:250px;background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;box-shadow:0 6px 22px rgba(0,0,0,.12);display:none}
  #props h3{margin:0 0 6px;font-size:13px} #props label{display:flex;align-items:center;gap:6px;margin:4px 0;font-size:12px;color:var(--mut)} #props label span{width:78px}
  #props input{flex:1;min-width:0;padding:4px 6px;border:1px solid var(--bd);border-radius:6px;font:inherit}
  #props .linha{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px} #props button{flex:1;font:inherit;font-size:12px;padding:5px 4px;border:1px solid var(--bd);border-radius:7px;background:#f4f6f8;cursor:pointer}
  #props button:hover{background:#e8edf2} #props .del{color:#b71c1c}
  #estado{position:absolute;right:12px;top:12px;width:280px;background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;box-shadow:0 6px 22px rgba(0,0,0,.12);display:none;font-size:12.5px}
  #estado h3{margin:0 0 6px;font-size:13px} #estado ul{margin:4px 0 0;padding-left:18px} #estado li{margin:3px 0} #estado .ok{color:var(--ok);font-weight:700} #estado .mut{color:var(--mut)}
  #dica{position:absolute;left:12px;bottom:10px;color:var(--mut);font-size:12px;background:rgba(255,255,255,.88);padding:5px 8px;border-radius:8px;pointer-events:none;max-width:calc(100% - 24px)}
  #fantasma{position:fixed;pointer-events:none;opacity:.8;z-index:50;display:none}
  .rot{font:600 11px system-ui,Arial;fill:#1d2733;paint-order:stroke;stroke:#fff;stroke-width:4px;pointer-events:none}
  .badge{font:700 10px system-ui,Arial;pointer-events:none}
  @media print{ header,aside,#props,#dica,#estado{display:none!important} #app{display:block} main{height:100vh} }
</style>
</head>
<body>
<div id="app">
<header>
  <h1>Esquema 2D · superestrutura</h1>
  <button id="play" title="Simular a água no esquema montado">▶ Play</button>
  <select id="fundo" title="Fundo do esquema"></select>
  <label><input type="checkbox" id="grade" checked> Grade</label>
  <label><input type="checkbox" id="ima" checked> Encaixar</label>
  <label><input type="checkbox" id="rotulos" checked> Nomes</label>
  <label><input type="checkbox" id="portas" checked> Conexões</label>
  <button id="desfaz" title="Ctrl+Z">↶</button><button id="refaz" title="Ctrl+Y">↷</button>
  <button id="ajusta" title="Mostrar tudo">⤢ Enquadrar</button><button id="completo" title="Monta no esquema o sistema completo do simulador 3D, já ligado">Sistema completo</button>
  <span class="esp"></span>
  <button id="exporta" title="Baixar o esquema (.json)">Salvar arquivo</button><button id="importa">Abrir arquivo</button><input type="file" id="arq" accept=".json" hidden>
  <button id="imprime">Imprimir</button><button id="limpa">Limpar</button>
  <a href="index.html" id="voltar" title="Voltar ao simulador 3D"><button>← Simulador 3D</button></a>
</header>
<aside>
  <input type="search" id="busca" placeholder="Procurar item…">
  <div id="paleta"></div>
</aside>
<main>
  <svg id="palco" xmlns="http://www.w3.org/2000/svg"><defs>
    <pattern id="gp" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#e3e8ee" stroke-width="1"/></pattern>
    <pattern id="gg" width="100" height="100" patternUnits="userSpaceOnUse"><rect width="100" height="100" fill="url(#gp)"/><path d="M100 0H0V100" fill="none" stroke="#cfd6df" stroke-width="1.5"/></pattern></defs>
    <g id="mundo"><rect id="gradeR" x="-5000" y="-5000" width="10000" height="10000" fill="url(#gg)"/><image id="fundoImg"/><g id="itens"></g><g id="agua"></g><g id="marcas"></g><g id="selG"></g></g></svg>
  <div id="props"><h3 id="pNome"></h3>
    <label><span>Nome</span><input id="pRot" placeholder="(nome do item)"></label>
    <label><span>X / Y (m)</span><input id="pX" type="number" step="0.05"><input id="pY" type="number" step="0.05"></label>
    <label><span>Larg. / alt. (m)</span><input id="pW" type="number" step="0.05" min="0.05"><input id="pH" type="number" step="0.05" min="0.05"></label>
    <label><span>Giro (°)</span><input id="pR" type="number" step="15"></label>
    <div class="linha"><button id="bAnti" title="Girar 15° anti-horário (Shift: 90°)">↺ 15°</button><button id="bHor" title="Girar 15° horário (Shift: 90°)">↻ 15°</button><button id="bEspelha">⇋ Espelhar</button></div>
    <div class="linha"><button id="bProp" title="Volta à proporção original do desenho">Proporção original</button><button id="bDup">Duplicar</button></div>
    <div class="linha"><button id="bFrente">Para frente</button><button id="bTras">Para trás</button><button id="bDel" class="del">Excluir</button></div></div>
  <div id="estado"><h3>Simulação da água</h3><div id="estTxt"></div></div>
  <div id="dica"></div>
</main>
</div>
<img id="fantasma"><div id="erro" style="display:none;position:fixed;left:12px;bottom:12px;background:#b71c1c;color:#fff;padding:8px 12px;border-radius:8px;z-index:99;font-size:12px"></div>

enquadraQuandoPronto(0); window.addEventListener('load',()=>enquadraQuandoPronto(0)); document.addEventListener('visibilitychange',()=>{ if(!document.hidden) aplicaVista(); });
